name: Build GKI android12-5.10 + BakaSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
            /usr/local/graalvm /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Setup swap
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile /mnt/swapfile 2>/dev/null || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential bc bison flex \
              libssl-dev libelf-dev python3 python3-pip \
              device-tree-compiler clang lld llvm

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Builder"

      - name: Sync kernel source from scratch
        run: |
          mkdir -p ~/gki && cd ~/gki
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-lts --depth=1
          repo sync -j$(nproc) -c --no-tags --force-sync --optimized-fetch

      - name: Show synced kernel version
        run: |
          cd ~/gki/common
          echo "=== Branch & HEAD commit ==="
          git rev-parse --abbrev-ref HEAD
          git log -1 --format="%H %ad %s" --date=short

      - name: Integrate BakaSU
        run: |
          cd ~/gki/common
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -
          ls KernelSU/

      - name: Show BakaSU hook/config requirements
        run: |
          cd ~/gki/common
          echo "=== Hook check files (jika ada) ==="
          find KernelSU -iname "*check*.mk" -exec echo "--- {} ---" \; -exec cat {} \; || true
          echo "=== Kconfig entries terkait KSU/TRACEPOINT/HOOK ==="
          find KernelSU -iname "Kconfig" -exec grep -n "^config KSU\|TRACEPOINT\|AUTO_HOOK\|HOOK" {} \; || true

      - name: Enable kernel config
        run: |
          cat >> ~/gki/common/arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_LOCALVERSION="localhost-nodsea"
          CONFIG_LOCALVERSION_AUTO=n
          EOF
          rm -f ~/gki/common/android/abi_gki_protected_exports_aarch64
          rm -f ~/gki/common/android/abi_gki_protected_exports_x86_64

      - name: Disable Build default value
        run: |
          sed -i 's/POST_DEFCONFIG_CMDS="check_defconfig"/#POST_DEFCONFIG_CMDS="check_defconfig"/g' ~/gki/common/build.config.gki

      - name: Normalize defconfig
        run: |
          cd ~/gki/common
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out gki_defconfig
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out savedefconfig
          cp out/defconfig arch/arm64/configs/gki_defconfig
          rm -rf out

      - name: Verify kernel version before build
        run: |
          cd ~/gki/common
          VERSION=$(grep -m1 "^VERSION = " Makefile | awk '{print $3}')
          PATCHLEVEL=$(grep -m1 "^PATCHLEVEL = " Makefile | awk '{print $3}')
          SUBLEVEL=$(grep -m1 "^SUBLEVEL = " Makefile | awk '{print $3}')
          EXTRAVERSION=$(grep -m1 "^EXTRAVERSION = " Makefile | awk '{print $3}')
          FULL_VERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}${EXTRAVERSION}"
          echo "Kernel version yang akan di-compile: $FULL_VERSION"
          echo "kernel_version=$FULL_VERSION" >> $GITHUB_ENV

          if [ -z "$VERSION" ] || [ -z "$PATCHLEVEL" ] || [ -z "$SUBLEVEL" ]; then
            echo "::error::Gagal membaca versi kernel dari Makefile — source kemungkinan tidak lengkap/corrupt."
            exit 1
          fi

          if [ "$PATCHLEVEL" != "10" ]; then
            echo "::warning::PATCHLEVEL terbaca $PATCHLEVEL, bukan 10 — pastikan branch yang di-sync memang android12-5.10-lts."
          fi

      - name: Build kernel
        run: |
          cd ~/gki
          echo "Building kernel version: $kernel_version"
          SKIP_ABI_CHECKS=1 LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh 2>&1 | tee build.log

      - name: Show hook detection summary
        if: always()
        run: |
          grep -i "bakasu\|kernelsu\|tracepoint\|hook\|lost\|incompatible" ~/gki/build.log | head -60 || true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ~/gki/build.log
          retention-days: 7

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel-image-android12-5.10-bakasu
          path: |
            ~/gki/out/android12-5.10/dist/Image
            ~/gki/out/android12-5.10/dist/Image.gz
          retention-days: 14
      # ===================== BUNDLING ANYKERNEL3 =====================

      - name: Clone AnyKernel3 template
        if: success()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ~/AnyKernel3
          rm -rf ~/AnyKernel3/.git

      - name: Configure anykernel.sh
        if: success()
        run: |
          cd ~/AnyKernel3
          cat > anykernel.sh << EOF
          properties() { '
          kernel.string=BakaSU android12-5.10 (${kernel_version})
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=X6833B
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh
          EOF

      - name: Copy kernel image into AnyKernel3
        if: success()
        run: |
          cp ~/gki/out/android12-5.10/dist/Image.gz ~/AnyKernel3/Image.gz 2>/dev/null || \
          cp ~/gki/out/android12-5.10/dist/Image ~/AnyKernel3/Image

      - name: Package AnyKernel3 zip
        if: success()
        id: package
        run: |
          cd ~/AnyKernel3
          ZIPNAME="BakaSU-android12-5.10-X6833B-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "$ZIPNAME" . -x ".git*"
          echo "zip_path=$HOME/AnyKernel3/$ZIPNAME" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIPNAME" >> $GITHUB_OUTPUT

      - name: Upload AnyKernel3 zip as artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          retention-days: 14

      # ===================== UPLOAD KE TELEGRAM =====================

      - name: Upload to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CAPTION="Build berhasil
          Kernel: android12-5.10 (${kernel_version})
          Root: BakaSU (Tracepoint hook)
          Device: X6833B
          Commit: $(cd ~/gki/common && git rev-parse --short HEAD)
          Tanggal: $(date '+%Y-%m-%d %H:%M UTC')"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="${CHAT_ID}" \
            -F document=@"${{ steps.package.outputs.zip_path }}" \
            -F caption="${CAPTION}"

      - name: Notify Telegram on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="Build GAGAL — cek log di GitHub Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

