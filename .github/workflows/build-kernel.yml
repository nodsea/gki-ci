name: Build GKI android12-5.10 + KSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential bc bison flex \
              libssl-dev libelf-dev python3 python3-pip \
              device-tree-compiler clang lld llvm

      - name: Using Node.js version 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          # Optional : Enables automatic package caching
          
      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI Builder"

      - name: Sync kernel source from scratch
        run: |
          mkdir -p ~/gki && cd ~/gki
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-lts --depth=1
          repo sync -j$(nproc) -c --no-tags

      - name: Integrate KSU
        run: |
          cd ~/gki/common
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          ls KernelSU/

      - name: Enable kernel config
        run: |
          cat >> ~/gki/common/arch/arm64/configs/gki_defconfig << 'EOF'
          CONFIG_KSU=y
          CONFIG_LOCALVERSION="localhost-nodsea"
          CONFIG_LOCALVERSION_AUTO=n
          EOF
          rm -f ~/gki/common/android/abi_gki_protected_exports_aarch64
          rm -f ~/gki/common/android/abi_gki_protected_exports_x86_64

      - name: Disable Build default value
        run: |
          sed 's/POST_DEFCONFIG_CMDS="check_defconfig"/#POST_DEFCONFIG_CMDS="check_defconfig"' ~/gki/common/build.config.gki
          
      - name: Build kernel
        run: |
          cd ~/gki
          SKIP_ABI_CHECKS=1 BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh 2>&1 | tee build.log

      - name: Show hook detection summary
        if: always()
        run: |
          grep -i "kernelsu\|hook\|lost\|incompatible" ~/gki/build.log | head -40 || true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ~/gki/build.log
          retention-days: 7

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kernel-image-android12-5.10-ksu
          path: |
            ~/gki/out/android12-5.10/dist/Image
            ~/gki/out/android12-5.10/dist/Image.gz
          retention-days: 14
